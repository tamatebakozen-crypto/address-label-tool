<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宛名ラベル印刷ツール</title>
<style>
  /* ===== 基本スタイル ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Yu Gothic', 'Meiryo', sans-serif; background: #f5f5f5; color: #333; }

  .app { max-width: 1100px; margin: 0 auto; padding: 20px; }
  h1 { text-align: center; margin-bottom: 24px; font-size: 1.5rem; color: #2c3e50; }

  /* ===== レイアウト：左フォーム、右グリッド ===== */
  .main-layout { display: flex; gap: 24px; align-items: flex-start; }
  .left-panel { flex: 0 0 360px; }
  .right-panel { flex: 1; min-width: 0; }

  /* ===== フォーム ===== */
  .form-section { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); margin-bottom: 16px; }
  .form-section h2 { font-size: 1rem; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid #3498db; color: #2c3e50; }

  .form-group { margin-bottom: 10px; }
  .form-group label { display: block; font-size: 0.8rem; font-weight: bold; margin-bottom: 3px; color: #555; }
  .form-group input, .form-group select {
    width: 100%; padding: 7px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem;
    font-family: inherit;
  }
  .form-group input:focus, .form-group select:focus { outline: none; border-color: #3498db; box-shadow: 0 0 0 2px rgba(52,152,219,0.2); }

  .form-row { display: flex; gap: 10px; }
  .form-row .form-group { flex: 1; }

  /* ===== ボタン ===== */
  .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem; font-family: inherit; transition: background 0.2s; }
  .btn-primary { background: #3498db; color: #fff; }
  .btn-primary:hover { background: #2980b9; }
  .btn-success { background: #27ae60; color: #fff; }
  .btn-success:hover { background: #219a52; }
  .btn-danger { background: #e74c3c; color: #fff; }
  .btn-danger:hover { background: #c0392b; }
  .btn-outline { background: #fff; color: #555; border: 1px solid #ccc; }
  .btn-outline:hover { background: #f0f0f0; }
  .btn-print { background: #8e44ad; color: #fff; font-size: 1rem; padding: 10px 24px; }
  .btn-print:hover { background: #7d3c98; }

  .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }

  /* ===== グリッド（ラベル位置選択） ===== */
  .grid-section { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
  .grid-section h2 { font-size: 1rem; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid #27ae60; color: #2c3e50; }
  .grid-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .grid-header h2 { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }

  .label-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    background: #ddd;
    border: 2px solid #ddd;
    border-radius: 4px;
  }
  .label-cell {
    background: #fff;
    aspect-ratio: 66 / 33.9;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: flex-start;
    cursor: pointer;
    padding: 6px 8px;
    font-size: 0.55rem;
    line-height: 1.3;
    text-align: left;
    color: #aaa;
    transition: all 0.15s;
    overflow: hidden;
    position: relative;
    user-select: none;
  }
  .label-cell:hover { background: #f0f8ff; }
  .label-cell.selected { background: #eaf6ff; border: 2px solid #3498db; color: #333; }
  .label-cell .cell-number { position: absolute; top: 2px; left: 4px; font-size: 0.5rem; color: #bbb; }
  .label-cell.selected .cell-number { color: #3498db; }
  .label-cell .preview-content { font-size: 0.5rem; line-height: 1.3; word-break: break-all; width: 100%; flex: 1; display: flex; flex-direction: column; }
  .label-cell .preview-content .pv-zip { font-size: 0.4rem; }
  .label-cell .preview-content .pv-addr { font-size: 0.4rem; }
  .label-cell .preview-content .pv-sep { border-top: 1px solid #ccc; margin: 3px 0; }
  .label-cell .preview-content .pv-company { font-size: 0.4rem; line-height: 1.2; word-wrap: break-word; overflow-wrap: break-word; }
  .label-cell .preview-content .pv-name-wrap { flex: 1; display: flex; align-items: center; }
  .label-cell .preview-content .pv-name { font-size: 0.6rem; font-weight: bold; }

  .print-actions { text-align: center; margin-top: 16px; }

  /* ===== 印刷向きガイド ===== */
  .print-guide {
    background: #fffbea; border: 1px solid #f0d060; border-radius: 8px;
    padding: 14px 16px; margin-top: 16px;
    display: flex; gap: 16px; align-items: center;
  }
  .print-guide .guide-text { flex: 1; }
  .print-guide h3 { font-size: 0.9rem; color: #8a6d00; margin-bottom: 8px; }
  .print-guide ul { margin-left: 1.2em; font-size: 0.85rem; line-height: 1.7; color: #555; }
  .print-guide ul b { color: #c0392b; }
  .print-guide .guide-figure { flex: 0 0 150px; text-align: center; }
  .print-guide .guide-figure svg { width: 150px; height: auto; }
  .print-adjust { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #e0cc80; font-size: 0.8rem; color: #555; }
  .print-adjust .adjust-title { font-weight: bold; color: #8a6d00; white-space: nowrap; }
  .print-adjust .adjust-item { white-space: nowrap; margin-right: 8px; }
  .print-adjust input { width: 60px; padding: 3px 6px; border: 1px solid #ccc; border-radius: 4px; text-align: center; font-family: inherit; }
  .print-adjust .adjust-hint { color: #999; margin-left: 4px; }

  /* ===== テンプレート ===== */
  .template-section { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); margin-bottom: 16px; }
  .template-section h2 { font-size: 1rem; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid #e67e22; color: #2c3e50; }
  .template-save-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .template-save-row input { flex: 1; }
  .template-list { max-height: 200px; overflow-y: auto; }
  .template-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 10px; border: 1px solid #eee; border-radius: 4px; margin-bottom: 4px;
    font-size: 0.85rem; cursor: pointer; transition: background 0.15s;
  }
  .template-item:hover { background: #fef9f3; }
  .template-item .tpl-name { flex: 1; }
  .template-item .tpl-preview { color: #888; font-size: 0.75rem; margin: 0 8px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .template-item .tpl-delete { color: #e74c3c; cursor: pointer; font-size: 0.8rem; padding: 2px 6px; border-radius: 3px; }
  .template-item .tpl-delete:hover { background: #fde8e6; }
  .no-templates { color: #aaa; font-size: 0.85rem; text-align: center; padding: 12px; }

  /* ===== 印刷用スタイル ===== */
  @media print {
    @page {
      size: A4;
      margin: 0;
    }
    body { background: #fff; }
    .no-print { display: none !important; }
    .print-sheet {
      display: block !important;
      width: 210mm;
      height: 297mm;
      position: relative;
      page-break-after: always;
    }
    .print-label {
      position: absolute;
      width: 66mm;
      height: 33.9mm;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 1.5mm 3mm;
      font-size: 9pt;
      line-height: 1.4;
      /* Apeos C3571の給紙向き（上側を下向き・ラベル面上向き）に合わせて、
         各ラベルを180°回転＋点対称の位置に配置して出力する（配置はprintLabels()側） */
      transform: rotate(180deg);
    }
    .print-label .p-zip { font-size: 7pt; }
    .print-label .p-addr { font-size: 7pt; }
    .print-label .p-separator { border-top: 0.5pt solid #999; margin: 1.5mm 0; }
    .print-label .p-company-dept { font-size: 7pt; line-height: 1.3; word-wrap: break-word; overflow-wrap: break-word; }
    .print-label .p-name-wrap { flex: 1; display: flex; align-items: center; }
    .print-label .p-name { font-size: 12pt; font-weight: bold; }
  }
  .print-sheet { display: none; }
</style>
</head>
<body>

<div class="app no-print">
  <h1>宛名ラベル印刷ツール</h1>
  <div class="main-layout">

    <!-- 左パネル：入力フォーム + テンプレート -->
    <div class="left-panel">
      <div class="form-section">
        <h2>宛先情報</h2>
        <div class="form-group">
          <label>郵便番号</label>
          <input type="text" id="zip" placeholder="例：123-4567">
        </div>
        <div class="form-group">
          <label>住所1（都道府県・市区町村）</label>
          <input type="text" id="addr1" placeholder="例：東京都千代田区丸の内1-1-1">
        </div>
        <div class="form-group">
          <label>住所2（建物名等）</label>
          <input type="text" id="addr2" placeholder="例：○○ビル 3階">
        </div>
        <div class="form-group">
          <label>会社名</label>
          <input type="text" id="company" placeholder="例：株式会社○○">
        </div>
        <div class="form-group">
          <label>部署名</label>
          <input type="text" id="dept" placeholder="例：営業部">
        </div>
        <div class="form-row">
          <div class="form-group" style="flex:2">
            <label>宛名</label>
            <input type="text" id="name" placeholder="例：山田 太郎">
          </div>
          <div class="form-group" style="flex:1">
            <label>敬称</label>
            <select id="honorific">
              <option value="様">様</option>
              <option value="御中">御中</option>
              <option value="殿">殿</option>
              <option value="">なし</option>
            </select>
          </div>
        </div>
      </div>

      <!-- テンプレート -->
      <div class="template-section">
        <h2>テンプレート</h2>
        <div class="template-save-row">
          <input type="text" id="tplName" placeholder="テンプレート名">
          <button class="btn btn-success" onclick="saveTemplate()">保存</button>
        </div>
        <div class="template-list" id="tplList">
          <div class="no-templates">保存済みテンプレートなし</div>
        </div>
      </div>
    </div>

    <!-- 右パネル：グリッド -->
    <div class="right-panel">
      <div class="grid-section">
        <div class="grid-header">
          <h2>ラベル位置選択（A-ONE 24面）</h2>
          <div class="btn-group" style="margin-bottom:0">
            <button class="btn btn-outline" onclick="selectAll()">全選択</button>
            <button class="btn btn-outline" onclick="deselectAll()">全解除</button>
          </div>
        </div>
        <div class="label-grid" id="labelGrid"></div>

        <!-- 用紙セット向きガイド -->
        <div class="print-guide">
          <div class="guide-text">
            <h3>🖨 ラベル用紙のセット方法（FUJIFILM Apeos C3571）</h3>
            <ul>
              <li>用紙の<b>上側（1〜3番ラベルがある側）を、プリンターと反対側（手前）</b>にして入れる</li>
              <li>ラベル面（印刷面）は<b>上向き</b>にセットする</li>
              <li>印刷ダイアログでは倍率<b>「100%（実際のサイズ）」</b>・余白<b>「なし」</b>を選択する（「用紙に合わせる」は位置ずれの原因になります）</li>
            </ul>
            <div class="print-adjust">
              <span class="adjust-title">印刷位置の微調整（mm）：</span>
              <span class="adjust-item"><label>上下 <input type="number" id="offsetY" value="0" step="0.5" onchange="saveOffsets()"></label><span class="adjust-hint">＋で下へ</span></span>
              <span class="adjust-item"><label>左右 <input type="number" id="offsetX" value="0" step="0.5" onchange="saveOffsets()"></label><span class="adjust-hint">＋で右へ</span></span>
            </div>
          </div>
          <div class="guide-figure">
            <svg viewBox="0 0 150 190" xmlns="http://www.w3.org/2000/svg">
              <!-- ラベル用紙 -->
              <rect x="45" y="10" width="60" height="84" fill="#fff" stroke="#999" stroke-width="1.5" rx="2"/>
              <!-- ラベル枠（3列×4行の簡略表示） -->
              <g stroke="#ccc" stroke-width="0.8" fill="none">
                <line x1="65" y1="14" x2="65" y2="90"/>
                <line x1="85" y1="14" x2="85" y2="90"/>
                <line x1="49" y1="31" x2="101" y2="31"/>
                <line x1="49" y1="52" x2="101" y2="52"/>
                <line x1="49" y1="73" x2="101" y2="73"/>
              </g>
              <!-- 1〜3番の番号（用紙の上側＝プリンターと反対側） -->
              <text x="57" y="26" font-size="7" fill="#e67e22" text-anchor="middle" font-weight="bold">1</text>
              <text x="75" y="26" font-size="7" fill="#e67e22" text-anchor="middle" font-weight="bold">2</text>
              <text x="93" y="26" font-size="7" fill="#e67e22" text-anchor="middle" font-weight="bold">3</text>
              <!-- ラベル面上向きの注記 -->
              <text x="12" y="45" font-size="8" fill="#555">ラベル面</text>
              <text x="12" y="55" font-size="8" fill="#c0392b" font-weight="bold">上向き</text>
              <!-- 「用紙の上側」ラベル（プリンターと反対側） -->
              <text x="110" y="20" font-size="8" fill="#c0392b" font-weight="bold">上側</text>
              <!-- 矢印（下向きに差し込む） -->
              <path d="M75 98 L75 118" stroke="#c0392b" stroke-width="2.5" fill="none"/>
              <path d="M69 112 L75 120 L81 112" stroke="#c0392b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              <!-- プリンター -->
              <rect x="25" y="128" width="100" height="44" fill="#546e7a" rx="5"/>
              <rect x="40" y="124" width="70" height="6" fill="#37474f" rx="3"/>
              <text x="75" y="154" font-size="10" fill="#fff" text-anchor="middle">プリンター</text>
              <text x="75" y="166" font-size="7" fill="#cfd8dc" text-anchor="middle">Apeos C3571</text>
            </svg>
          </div>
        </div>

        <div class="print-actions">
          <button class="btn btn-print" onclick="printLabels()">印刷</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 印刷用シート -->
<div class="print-sheet" id="printSheet"></div>

<script>
  // ===== 状態管理 =====
  const selectedCells = new Set();
  const STORAGE_KEY = 'label_templates';

  // ===== A-ONE 24面レイアウト定数（mm） =====
  const LAYOUT = {
    cols: 3,
    rows: 8,
    labelW: 66,
    labelH: 33.9,
    marginTop: 12.9,
    marginLeft: 6,
    gapX: 0,
    gapY: 0
  };

  // ===== グリッド初期化 =====
  function initGrid() {
    const grid = document.getElementById('labelGrid');
    grid.innerHTML = '';
    for (let i = 0; i < 24; i++) {
      const cell = document.createElement('div');
      cell.className = 'label-cell';
      cell.dataset.index = i;
      cell.innerHTML = `<span class="cell-number">${i + 1}</span><div class="preview-content"></div>`;
      cell.addEventListener('click', () => toggleCell(i));
      grid.appendChild(cell);
    }
  }

  function toggleCell(index) {
    if (selectedCells.has(index)) {
      selectedCells.delete(index);
    } else {
      selectedCells.add(index);
    }
    updateGrid();
  }

  function selectAll() {
    for (let i = 0; i < 24; i++) selectedCells.add(i);
    updateGrid();
  }

  function deselectAll() {
    selectedCells.clear();
    updateGrid();
  }

  function updateGrid() {
    const cells = document.querySelectorAll('.label-cell');
    const data = getFormData();
    cells.forEach((cell, i) => {
      const preview = cell.querySelector('.preview-content');
      if (selectedCells.has(i)) {
        cell.classList.add('selected');
        preview.innerHTML = buildPreviewHtml(data);
      } else {
        cell.classList.remove('selected');
        preview.innerHTML = '';
      }
    });
  }

  // ===== フォームデータ取得 =====
  function getFormData() {
    return {
      zip: document.getElementById('zip').value.trim(),
      addr1: document.getElementById('addr1').value.trim(),
      addr2: document.getElementById('addr2').value.trim(),
      company: document.getElementById('company').value.trim(),
      dept: document.getElementById('dept').value.trim(),
      name: document.getElementById('name').value.trim(),
      honorific: document.getElementById('honorific').value
    };
  }

  function setFormData(data) {
    document.getElementById('zip').value = data.zip || '';
    document.getElementById('addr1').value = data.addr1 || '';
    document.getElementById('addr2').value = data.addr2 || '';
    document.getElementById('company').value = data.company || '';
    document.getElementById('dept').value = data.dept || '';
    document.getElementById('name').value = data.name || '';
    document.getElementById('honorific').value = data.honorific !== undefined ? data.honorific : '様';
    updateGrid();
  }

  function buildPreviewText(d) {
    const parts = [];
    if (d.zip) parts.push('〒' + d.zip);
    if (d.addr1) parts.push(d.addr1);
    if (d.company) parts.push(d.company);
    if (d.name) parts.push(d.name + (d.honorific ? ' ' + d.honorific : ''));
    return parts.join(' / ');
  }

  function buildPreviewHtml(d) {
    let html = '';
    if (d.zip) html += `<div class="pv-zip">〒${escapeHtml(d.zip)}</div>`;
    if (d.addr1) html += `<div class="pv-addr">${escapeHtml(d.addr1)}</div>`;
    if (d.addr2) html += `<div class="pv-addr">${escapeHtml(d.addr2)}</div>`;
    const hasAddr = d.zip || d.addr1 || d.addr2;
    const hasBottom = d.company || d.dept || d.name;
    if (hasAddr && hasBottom) html += `<div class="pv-sep"></div>`;
    if (d.company) html += `<div class="pv-company">${escapeHtml(d.company)}</div>`;
    if (d.dept) html += `<div class="pv-company">${escapeHtml(d.dept)}</div>`;
    if (d.name) {
      html += `<div class="pv-name-wrap"><div class="pv-name">${escapeHtml(d.name)}${d.honorific ? escapeHtml(d.honorific) : ''}</div></div>`;
    }
    return html;
  }

  // ===== 印刷 =====
  function printLabels() {
    if (selectedCells.size === 0) {
      alert('印刷するラベル位置を選択してください。');
      return;
    }
    const data = getFormData();
    if (!data.name && !data.company) {
      alert('宛名または会社名を入力してください。');
      return;
    }

    const sheet = document.getElementById('printSheet');
    sheet.innerHTML = '';

    const offset = getPrintOffsets();

    selectedCells.forEach(index => {
      const row = Math.floor(index / LAYOUT.cols);
      const col = index % LAYOUT.cols;

      // 用紙上の本来のラベル位置
      const physLeft = LAYOUT.marginLeft + col * (LAYOUT.labelW + LAYOUT.gapX) + offset.x;
      const physTop = LAYOUT.marginTop + row * (LAYOUT.labelH + LAYOUT.gapY) + offset.y;

      // 給紙向き（上側を下向き・ラベル面上向き）に合わせ、ページ上では点対称の位置に配置。
      // ラベル自体はCSSで180°回転しているため、用紙上では正しい向き・位置に印刷される
      const left = 210 - physLeft - LAYOUT.labelW;
      const top = 297 - physTop - LAYOUT.labelH;

      const label = document.createElement('div');
      label.className = 'print-label';
      label.style.left = left + 'mm';
      label.style.top = top + 'mm';

      let html = '';
      if (data.zip) html += `<div class="p-zip">〒${escapeHtml(data.zip)}</div>`;
      if (data.addr1) html += `<div class="p-addr">${escapeHtml(data.addr1)}</div>`;
      if (data.addr2) html += `<div class="p-addr">${escapeHtml(data.addr2)}</div>`;
      const hasCompanyOrName = data.company || data.dept || data.name;
      if (hasCompanyOrName && (data.zip || data.addr1 || data.addr2)) {
        html += `<div class="p-separator"></div>`;
      }
      if (data.company) html += `<div class="p-company-dept">${escapeHtml(data.company)}</div>`;
      if (data.dept) html += `<div class="p-company-dept">${escapeHtml(data.dept)}</div>`;
      if (data.name) {
        const nameStr = escapeHtml(data.name) + (data.honorific ? escapeHtml(data.honorific) : '');
        html += `<div class="p-name-wrap"><div class="p-name">${nameStr}</div></div>`;
      }

      label.innerHTML = html;
      sheet.appendChild(label);
    });

    window.print();
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // ===== 印刷位置の微調整 =====
  const OFFSET_KEY = 'label_print_offset';

  function getPrintOffsets() {
    return {
      x: parseFloat(document.getElementById('offsetX').value) || 0,
      y: parseFloat(document.getElementById('offsetY').value) || 0
    };
  }

  function saveOffsets() {
    localStorage.setItem(OFFSET_KEY, JSON.stringify(getPrintOffsets()));
  }

  function loadOffsets() {
    try {
      const o = JSON.parse(localStorage.getItem(OFFSET_KEY) || '{}');
      if (o.x) document.getElementById('offsetX').value = o.x;
      if (o.y) document.getElementById('offsetY').value = o.y;
    } catch {}
  }

  // ===== テンプレート管理 =====
  function getTemplates() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    } catch { return []; }
  }

  function saveTemplates(templates) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(templates));
  }

  function saveTemplate() {
    const nameInput = document.getElementById('tplName');
    const tplName = nameInput.value.trim();
    if (!tplName) {
      alert('テンプレート名を入力してください。');
      return;
    }
    const templates = getTemplates();
    const existing = templates.findIndex(t => t.name === tplName);
    const entry = { name: tplName, data: getFormData() };

    if (existing >= 0) {
      if (confirm(`「${tplName}」を上書きしますか？`)) {
        templates[existing] = entry;
      } else {
        return;
      }
    } else {
      templates.push(entry);
    }

    saveTemplates(templates);
    nameInput.value = '';
    renderTemplates();
  }

  function loadTemplate(index) {
    const templates = getTemplates();
    if (templates[index]) {
      setFormData(templates[index].data);
    }
  }

  function deleteTemplate(index, event) {
    event.stopPropagation();
    const templates = getTemplates();
    if (confirm(`「${templates[index].name}」を削除しますか？`)) {
      templates.splice(index, 1);
      saveTemplates(templates);
      renderTemplates();
    }
  }

  function renderTemplates() {
    const list = document.getElementById('tplList');
    const templates = getTemplates();
    if (templates.length === 0) {
      list.innerHTML = '<div class="no-templates">保存済みテンプレートなし</div>';
      return;
    }
    list.innerHTML = templates.map((t, i) => {
      const preview = t.data.company ? t.data.company + ' ' : '';
      const namePreview = t.data.name ? t.data.name : '';
      return `<div class="template-item" onclick="loadTemplate(${i})">
        <span class="tpl-name">${escapeHtml(t.name)}</span>
        <span class="tpl-preview">${escapeHtml(preview + namePreview)}</span>
        <span class="tpl-delete" onclick="deleteTemplate(${i}, event)">削除</span>
      </div>`;
    }).join('');
  }

  // ===== フォーム入力のリアルタイム反映 =====
  document.querySelectorAll('#zip, #addr1, #addr2, #company, #dept, #name, #honorific').forEach(el => {
    el.addEventListener('input', updateGrid);
    el.addEventListener('change', updateGrid);
  });

  // ===== 初期化 =====
  initGrid();
  renderTemplates();
  loadOffsets();
</script>
</body>
</html>
